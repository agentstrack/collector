name: 🐛 Bug report
description: Something the collector does wrong, or fails to do.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Two things make a bug fixable here: the `agentstrack doctor`
        output, and a **redacted** sample of the log line that triggers it.

        ⚠️ **Never paste an unredacted session log, a real prompt, or an API key.** Scrub paths,
        ids and content before pasting. If you cannot reproduce it without real data, say so and
        we will find another way.

        🔒 If this is a security vulnerability, stop here and email security@agentstrack.ai.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
      placeholder: |
        I ran `agentstrack start`, then used Claude Code for an hour. `agentstrack status`
        shows 0 sessions and the spool stays empty.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. agentstrack login at_test_… --api-url http://localhost:3001
        2. agentstrack start --foreground
        3. Open Claude Code, send one prompt
        4. agentstrack status
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Collector version
      description: Output of `agentstrack --version`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`agentstrack doctor` output"
      description: >
        Run `agentstrack doctor --json` and paste the output. It never contains your API key,
        prompts, or code. This field is required — almost every bug is diagnosed from it.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Which agent
      multiple: true
      options:
        - Claude Code
        - Codex
        - Not agent-specific
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Linux (arm64)
        - Windows (WSL)
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`. The collector requires Node >= 20.
      placeholder: "v22.11.0"
    validations:
      required: true

  - type: dropdown
    id: privacy-mode
    attributes:
      label: Privacy mode
      description: From `agentstrack config --show-effective`.
      options:
        - metadata
        - analytics (default)
        - full
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        From `~/.agentstrack/collector.log`, or from a `agentstrack start --foreground` run.
        The log records counts, queue depths and event ids, never payloads — but please scan it
        before pasting anyway.
      render: shell

  - type: textarea
    id: fixture
    attributes:
      label: Redacted sample log line (optional, but the fastest path to a fix)
      description: >
        If a specific agent log line triggers this, paste a scrubbed version: replace prompt text,
        paths, ids and repo names with placeholders, and delete anything credential-shaped.
      render: json

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest version, or have stated why I cannot upgrade.
          required: true
        - label: I searched existing issues for this.
          required: true
        - label: Everything I pasted is redacted — no real credentials, prompts, or private paths.
          required: true
