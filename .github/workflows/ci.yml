name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The package declares engines.node >= 24 (better-sqlite3 13 itself would
        # allow 22; 24 is our chosen floor). Test the floor and the current LTS so
        # the declared range is actually exercised.
        node: [24, 26]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # better-sqlite3 ships prebuilds; `npm ci` falls back to a source build
      # where none matches, so keep the toolchain available on both runners.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the CLI actually starts
        run: node dist/cli.js --version

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      # Catches a `files` entry that silently stopped matching — a broken
      # published tarball is much more expensive than a failed CI job.
      - name: Dry-run pack
        run: npm pack --dry-run
